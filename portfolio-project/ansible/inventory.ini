# Replace the IPs and user with your own VMs (find an IP with: ip -4 addr).
#
# Your lab: 1 Ubuntu control node (runs Ansible) + 2 managed nodes.
# The control node is ALSO deployed to, so the site runs on
# 1 CentOS VM and 2 Ubuntu VMs as the task requires.

[centos]
centos-node   ansible_host=192.168.56.101 ansible_user=student

[ubuntu]
ubuntu-node   ansible_host=192.168.56.102 ansible_user=student
# The control node manages itself directly, without SSH.
control-node  ansible_host=192.168.56.100 ansible_user=student ansible_connection=local

# Every machine that builds and runs the portfolio container.
[webservers:children]
centos
ubuntu
