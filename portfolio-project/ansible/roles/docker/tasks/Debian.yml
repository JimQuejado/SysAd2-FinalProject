# Ubuntu / Debian family: apt + Docker's Ubuntu repository signed with its GPG key.
- name: Remove unofficial Docker packages that conflict (Ubuntu)
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent

- name: Install prerequisites and Python requests (Ubuntu)
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - python3-requests
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyrings directory (Ubuntu)
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's GPG key (Ubuntu)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add the Docker CE repository (Ubuntu)
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install Docker Engine (Ubuntu)
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
