# Settings shared by every host in the "webservers" group.

# Image
image_name: sysad2-portfolio
image_tag: "1.0"

# Where the Dockerfile and web app are copied on each VM before building.
build_dir: /opt/portfolio/build

# Containers to run on every host. Add another entry to run more
# containers per VM (each needs its own host_port).
portfolio_containers:
  - name: portfolio-web
    host_port: 80

# Users that may run `docker` without sudo (the SSH user by default).
docker_users:
  - "{{ ansible_user }}"
